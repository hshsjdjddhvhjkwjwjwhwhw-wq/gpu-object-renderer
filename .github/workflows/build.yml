# Compila el mod para Windows, Android 32 bits y Android 64 bits en GitHub Actions
# (no hace falta compilar en el celular). Basado de memoria en la plantilla oficial de
# mods de Geode: VERIFY comparar con https://github.com/geode-sdk/example-mod
# (.github/workflows/multi-platform.yml) por si las versiones de las acciones cambiaron.
name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: armv7-linux-androideabi
          - name: Android64
            os: ubuntu-latest
            target: aarch64-linux-android

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
